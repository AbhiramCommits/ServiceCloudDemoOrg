name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Simulation, tests and metadata validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic data
        run: python data/generate_data.py

      - name: Run before/after simulation
        run: python -m sim.run_simulation --out results/

      - name: Evaluate deflection assistant
        run: python -m sim.eval_assistant --out results/

      - name: Run test suite
        run: pytest -q

      - name: Validate Salesforce metadata XML
        run: |
          python - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("force-app/**/*-meta.xml", recursive=True))
          failures = []
          for path in files:
              try:
                  ET.parse(path)
              except ET.ParseError as exc:
                  failures.append((path, exc))
          print(f"parsed {len(files)} metadata files")
          for path, exc in failures:
              print(f"INVALID XML: {path}: {exc}")
          if failures:
              sys.exit(1)
          PY

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: results/
          if-no-files-found: warn
